name: Check Flake

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: kleinbem/actions/nix-setup@7ec628296d5194e6e10031706387b992a10a1638 # v1.0.1
        with:
          nix-path: nixpkgs=channel:nixos-unstable
          # Read-only Attic over NetBird; skipped when the secrets are
          # absent (fork PRs, Dependabot).
          netbird-setup-key: ${{ secrets.NETBIRD_SETUP_KEY_EPHEMERAL }}
          attic-token: ${{ secrets.ATTIC_PULL_TOKEN }}
      - run: nix flake check --override-input nix-devshells github:kleinbem/nix-devshells
      - run: nix fmt --override-input nix-devshells github:kleinbem/nix-devshells -- --fail-on-change
      - name: Statix check
        run: nix run nixpkgs#statix -- check .
      - name: Deadnix check
        run: nix run nixpkgs#deadnix -- --fail .
      - name: Script syntax and shellcheck
        run: |
          for script in scripts/*; do
            bash -n "$script"
          done
          shellcheck -s bash scripts/*
