name: "Canary: mesh-llm"

# Builds nixpkgs' mesh-llm packages against MeshLLM main every night, so
# packaging breakage shows up long before the next release reaches nixpkgs.
# A failure opens (or comments on) one issue; the next green run closes it.

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      mesh_llm_rev:
        description: MeshLLM commit to build (default main)
        type: string
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: canary-mesh-llm
  cancel-in-progress: false

env:
  # The prep branch for the next MeshLLM release (already adapted to MeshLLM
  # main) until it lands in NixOS/nixpkgs#571722; then NixOS/nixpkgs master.
  NIXPKGS_REPO: kleinbem/nixpkgs
  NIXPKGS_REF: mesh-llm-next
  ISSUE_TITLE: "Canary: mesh-llm packaging fails against MeshLLM main"

jobs:
  # One MeshLLM commit for every platform.
  plan:
    runs-on: ubuntu-latest
    outputs:
      rev: ${{ steps.rev.outputs.rev }}
    steps:
      - id: rev
        env:
          MESH_LLM_REV: ${{ inputs.mesh_llm_rev }}
        run: |
          echo "rev=${MESH_LLM_REV:-$(git ls-remote https://github.com/Mesh-LLM/mesh-llm refs/heads/main | cut -f1)}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          # The NixOS test needs KVM, which only the x86 runners have.
          - name: x86_64-linux
            runner: ubuntu-latest
            attrs: native-runtime mesh-llm skippy client-ready network network-skippy goose nixos
          # The GPU runtimes build without a GPU; one ROCm target is enough.
          - name: x86_64-linux GPU runtimes
            runner: ubuntu-latest
            attrs: runtime-rocm runtime-cuda
            config: '{ allowUnfree = true; }'
          - name: aarch64-linux
            runner: ubuntu-24.04-arm
            attrs: native-runtime mesh-llm skippy client-ready network network-skippy goose
          - name: aarch64-darwin
            runner: macos-latest
            attrs: native-runtime mesh-llm skippy
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 340
    steps:
      # The Rust workspace and llama.cpp need more than the runner's free disk.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.NIXPKGS_REPO }}
          ref: ${{ env.NIXPKGS_REF }}
          path: nixpkgs
          persist-credentials: false

      # The NixOS test runs a VM; the runner has KVM, but only root may use it.
      - name: Enable KVM
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31.11.2
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}
            system-features = nixos-test benchmark big-parallel kvm

      - name: Build
        env:
          NIXPKGS: nixpkgs
          MESH_LLM_REV: ${{ needs.plan.outputs.rev }}
          CANARY_NIXPKGS_CONFIG: ${{ matrix.config }}
          ATTRS: ${{ matrix.attrs }}
        run: |
          # shellcheck disable=SC2086 # ATTRS is a space-separated list
          canary/mesh-llm/run.sh $ATTRS

  # One issue for all platforms: opened or commented on any failure, closed
  # only when every platform is green.
  report:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.build.result }}
          MESH_LLM_REV: ${{ needs.plan.outputs.rev }}
        run: |
          issue="$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number // empty')"
          if [[ $RESULT == success ]]; then
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" --comment "Green again at MeshLLM \`${MESH_LLM_REV:0:9}\`."
            fi
          else
            body="MeshLLM [\`${MESH_LLM_REV:0:9}\`](https://github.com/Mesh-LLM/mesh-llm/commit/$MESH_LLM_REV) fails ($RESULT): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            if [[ -n "$issue" ]]; then
              gh issue comment "$issue" --body "$body"
            else
              gh issue create --title "$ISSUE_TITLE" --body "$body"
            fi
          fi
