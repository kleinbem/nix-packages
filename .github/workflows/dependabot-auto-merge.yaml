name: Dependabot auto-merge

# Shared policy: patch and minor bumps auto-merge, majors wait for a human.
# APP_ID/APP_PRIVATE_KEY are Dependabot secrets (nix/infra/github-secrets.tf).
on: pull_request

permissions: {}

jobs:
  auto-merge:
    permissions:
      pull-requests: read
    uses: kleinbem/actions/.github/workflows/dependabot-auto-merge.yaml@f1b4f5fc52ea31b1f9e53ca29170570fe4651c7d # v1.7.1
    secrets:
      app-id: ${{ secrets.APP_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
