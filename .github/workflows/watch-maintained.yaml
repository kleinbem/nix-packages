name: "Watch: maintained nixpkgs packages"

# Daily check of the nixpkgs packages and modules Martin maintains: others'
# PRs and issues, review requests, failed Hydra and nixpkgs-update runs. New
# findings go into one issue. Daily because committers merge unanswered PRs
# after about a week.

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: Report activity since this ISO date (default 26 hours ago)
        type: string
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: watch-maintained
  cancel-in-progress: false

env:
  ISSUE_TITLE: "Watch: maintained nixpkgs packages"

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install brotli
        run: command -v brotli || sudo apt-get install -y --no-install-recommends brotli

      - name: Check packages
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE: ${{ inputs.since }}
        # A failed check still posts what it found, then fails the run.
        run: |
          set -o pipefail
          watch/maintained/run.sh | tee report.md

      - name: Report
        if: always() && steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue="$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --limit 100 --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\"))[0].number // empty")"
          # Assigned, so each report notifies the owner (and reaches ntfy
          # through github-notify) without watching the whole repo.
          if [[ -n "$issue" ]]; then
            # A failed assignment must not cost the report.
            gh issue edit "$issue" --add-assignee "$GITHUB_REPOSITORY_OWNER" \
              || echo "::warning::could not assign #$issue to $GITHUB_REPOSITORY_OWNER"
            gh issue comment "$issue" --body-file report.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file report.md --assignee "$GITHUB_REPOSITORY_OWNER"
          fi
