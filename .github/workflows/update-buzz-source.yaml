name: "Update Buzz Source"

# Bumps pkgs/buzz/source.json to the latest block/buzz commit and opens a PR.
# Because all 7 Rust packages (buzz-relay, buzz-cli, buzz-acp, buzz-agent,
# buzz-dev-mcp, git-credential-nostr, git-sign-nostr) share the workspace
# source and cargo vendor hash, bumping source.json updates all 7 simultaneously.

on:
  schedule:
    # Wednesdays 04:00 UTC — offset 1 hour ahead of Buzz Desktop (05:00 UTC).
    - cron: '0 4 * * 3'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: "Bump source.json & open PR"
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Set up Nix
        uses: cachix/install-nix-action@v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            access-tokens = github.com=${{ steps.app-token.outputs.token }}

      - name: Run updater
        id: update
        run: |
          chmod +x scripts/update-buzz-source.sh
          ./scripts/update-buzz-source.sh

          if git diff HEAD --quiet -- pkgs/buzz/source.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            VER=$(jq -r '.version' pkgs/buzz/source.json)
            REV=$(jq -r '.rev' pkgs/buzz/source.json)
            echo "version=$VER" >> "$GITHUB_OUTPUT"
            echo "rev=${REV:0:9}" >> "$GITHUB_OUTPUT"
          fi

      # Server-side commit via createCommitOnBranch ensures cryptographic signatures
      # from GitHub App, satisfying org required_signatures branch protection rules.
      - name: Open PR
        id: cpr
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH_NAME="auto-update/buzz-source"
          REPO="${{ github.repository }}"
          MAIN_SHA=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)

          if gh api "repos/$REPO/git/ref/heads/$BRANCH_NAME" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/heads/$BRANCH_NAME" -f sha="$MAIN_SHA" -F force=true >/dev/null
          else
            gh api "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH_NAME" -f sha="$MAIN_SHA" >/dev/null
          fi

          jq -n \
            --arg repo "$REPO" \
            --arg branch "$BRANCH_NAME" \
            --arg sha "$MAIN_SHA" \
            --arg headline "chore(buzz): update source to ${{ steps.update.outputs.version }} (${{ steps.update.outputs.rev }})" \
            --arg content "$(base64 -w0 pkgs/buzz/source.json)" \
            --arg query 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }' \
            '{query: $query, variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                message: {headline: $headline},
                expectedHeadOid: $sha,
                fileChanges: {additions: [{path: "pkgs/buzz/source.json", contents: $content}]}
            }}}' | gh api graphql --input -

          BODY_FILE=$(mktemp)
          cat > "$BODY_FILE" <<'EOF'
          ## Buzz Source Update

          Bumps `pkgs/buzz/source.json` to **${{ steps.update.outputs.version }}** ([`block/buzz@${{ steps.update.outputs.rev }}`](https://github.com/block/buzz/commit/${{ steps.update.outputs.rev }})).

          This synchronously updates all 7 Rust packages:
          - `buzz-relay`
          - `buzz-cli`
          - `buzz-acp`
          - `buzz-agent`
          - `buzz-dev-mcp`
          - `git-credential-nostr`
          - `git-sign-nostr`

          All 7 packages were built (with their test suites) on the runner before this PR was opened.

          ---
          🤖 Opened automatically by the update-buzz-source workflow.
          EOF

          gh pr create \
            --title "chore(buzz): update source to ${{ steps.update.outputs.version }}" \
            --body-file "$BODY_FILE" \
            --head "$BRANCH_NAME" \
            --base main \
            --label automated \
            --label dependencies || true

          echo "pull-request-number=$(gh pr view "$BRANCH_NAME" --json number --jq .number)" >> "$GITHUB_OUTPUT"

      - name: Auto-merge
        if: steps.update.outputs.changed == 'true' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR" --squash --delete-branch --auto \
            || gh pr merge "$PR" --squash --delete-branch
