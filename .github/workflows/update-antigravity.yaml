name: "Update Antigravity"

# Bumps pkgs/antigravity/versions.json to the latest Google Antigravity
# releases and opens a PR. Hosted runner — this only discovers versions,
# prefetches hashes (from Google's official CDNs) and verifies the build.
#
# Attic warming is NOT done here: once this PR is merged and the meta-workspace
# (kleinbem/nix) bumps its nix-packages submodule pointer, the self-hosted
# `build-packages.yaml` there builds + pushes the closure to cache.kleinbem.dev
# (hosted runners hit the Cloudflare 413, so they never push).

on:
  schedule:
    # Saturdays 05:00 UTC — offset from the meta repo's Sunday update-and-warm.
    - cron: '0 5 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: "Bump versions.json & open PR"
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7.0.1
        with:
          # App token (TF-distributed APP_ID + APP_PRIVATE_KEY) rather than the
          # built-in GITHUB_TOKEN: an App identity can open + merge PRs
          # regardless of the repo's "Allow Actions to create/approve PRs"
          # setting, and its PRs trigger downstream workflows.
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Run updater
        id: update
        run: |
          chmod +x scripts/update-antigravity.sh
          ./scripts/update-antigravity.sh
          if git diff --quiet pkgs/antigravity/versions.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            ver() { jq -r ".\"$1\".\"x86_64-linux\".url" pkgs/antigravity/versions.json | grep -oP '[0-9]+\.[0-9]+\.[0-9]+-[0-9]+'; }
            {
              echo "app=$(ver 'Antigravity 2.0')"
              echo "ide=$(ver 'Antigravity IDE')"
              echo "cli=$(ver 'Antigravity CLI')"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Verify build (eval + build no-FHS IDE)
        if: steps.update.outputs.changed == 'true'
        run: |
          OV="--override-input nix-devshells github:kleinbem/nix-devshells"
          nix flake check $OV
          nix build $OV -L \
            .#packages.x86_64-linux.google-antigravity-ide-no-fhs \
            .#packages.x86_64-linux.google-antigravity-cli

      # Was peter-evans/create-pull-request, which does a plain local
      # `git commit` — unsigned, and can never satisfy this org's
      # required_signatures branch ruleset, so auto-merge below would never
      # fire. createCommitOnBranch commits server-side and GitHub signs it
      # automatically ("Verified", committer=GitHub), no key material needed.
      - name: Open PR
        id: cpr
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH_NAME="auto-update/antigravity"
          REPO="${{ github.repository }}"
          MAIN_SHA=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)

          if gh api "repos/$REPO/git/ref/heads/$BRANCH_NAME" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/heads/$BRANCH_NAME" -f sha="$MAIN_SHA" -F force=true >/dev/null
          else
            gh api "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH_NAME" -f sha="$MAIN_SHA" >/dev/null
          fi

          jq -n \
            --arg repo "$REPO" \
            --arg branch "$BRANCH_NAME" \
            --arg sha "$MAIN_SHA" \
            --arg headline "chore: update antigravity (app ${{ steps.update.outputs.app }}, ide ${{ steps.update.outputs.ide }}, cli ${{ steps.update.outputs.cli }})" \
            --arg content "$(base64 -w0 pkgs/antigravity/versions.json)" \
            --arg query 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }' \
            '{query: $query, variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                message: {headline: $headline},
                expectedHeadOid: $sha,
                fileChanges: {additions: [{path: "pkgs/antigravity/versions.json", contents: $content}]}
            }}}' | gh api graphql --input -

          BODY_FILE=$(mktemp)
          cat > "$BODY_FILE" <<'EOF'
          ## Antigravity update

          Bumps `pkgs/antigravity/versions.json` to the latest Google releases.
          Hashes were prefetched directly from Google's official CDNs.

          - **App 2.0**: `${{ steps.update.outputs.app }}`
          - **IDE**: `${{ steps.update.outputs.ide }}`
          - **CLI** (`agy`): `${{ steps.update.outputs.cli }}`

          ✅ `nix flake check` + `nix build` (no-FHS IDE, CLI) passed on CI.

          After merge, bump the `nix-packages` submodule in `kleinbem/nix` to warm Attic via `build-packages`.

          ---
          🤖 Opened automatically by the update-antigravity workflow.
          EOF

          gh pr create \
            --title "chore: update antigravity (ide ${{ steps.update.outputs.ide }})" \
            --body-file "$BODY_FILE" \
            --head "$BRANCH_NAME" \
            --base main \
            --label automated \
            --label antigravity || true

          echo "pull-request-number=$(gh pr view "$BRANCH_NAME" --json number --jq .number)" >> "$GITHUB_OUTPUT"

      # Fully hands-off: the build-verify step above is the gate, so squash-merge
      # immediately. Try repo auto-merge first; fall back to a direct merge if
      # "Allow auto-merge" is off or nothing is blocking.
      - name: Auto-merge
        if: steps.update.outputs.changed == 'true' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR" --squash --delete-branch --auto \
            || gh pr merge "$PR" --squash --delete-branch
