name: "Canary: buzz-app"

# Builds and tests nixpkgs' buzz-app against block/buzz-app main every night,
# so packaging breakage, and workarounds whose upstream fix landed, show up
# before the next desktop release reaches nixpkgs. A failure opens (or comments
# on) one issue; the next green run closes it.
# no-link: canary test harness detecting dropped upstream workarounds.

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      buzz_app_rev:
        description: buzz-app commit to build (default main)
        type: string
        default: ''
      nixpkgs_ref:
        description: kleinbem/nixpkgs branch to build with (default chosen by the MeshLLM match)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: canary-buzz-app
  cancel-in-progress: false

env:
  # Two recipes for NixOS/nixpkgs#577918 until buzz-app lands there: the
  # latest release's, and the same on top of nixpkgs' mesh-llm (#571722) with
  # Shared compute on its runtimes. The second builds once buzz-app pins a
  # MeshLLM of the same stage generation and skippy ABI.
  NIXPKGS_REPO: kleinbem/nixpkgs
  NIXPKGS_RELEASE_REF: buzz-app-prep
  NIXPKGS_MESH_REF: buzz-app-mesh
  ISSUE_TITLE: "Canary: buzz-app packaging fails against buzz-app main"
  MATCH_ISSUE_TITLE: "Canary: buzz-app main pins a MeshLLM that matches nixpkgs'"

jobs:
  # One commit for every platform.
  plan:
    runs-on: ubuntu-latest
    outputs:
      rev: ${{ steps.rev.outputs.rev }}
      match: ${{ steps.mesh.outputs.match }}
      nixpkgs_ref: ${{ steps.ref.outputs.nixpkgs_ref }}
    steps:
      - id: rev
        env:
          BUZZ_APP_REV: ${{ inputs.buzz_app_rev }}
        run: |
          rev="${BUZZ_APP_REV:-$(git ls-remote https://github.com/block/buzz-app refs/heads/main | cut -f1)}"
          [[ -n $rev ]] || { echo "could not resolve block/buzz-app main" >&2; exit 1; }
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: mesh
        env:
          BUZZ_APP_REV: ${{ steps.rev.outputs.rev }}
          NIXPKGS_REF: ${{ env.NIXPKGS_MESH_REF }}
        # A failed check still builds (with the release recipe) and is
        # reported as a failure.
        run: |
          if out="$(canary/buzz-app/mesh-match.sh)"; then
            echo "$out" | tee -a "$GITHUB_OUTPUT"
          else
            echo "::error::could not compare buzz-app's MeshLLM pin with nixpkgs'"
            echo "match=error" >> "$GITHUB_OUTPUT"
          fi

      - id: ref
        env:
          INPUT_REF: ${{ inputs.nixpkgs_ref }}
          MATCH: ${{ steps.mesh.outputs.match }}
          APP: ${{ steps.mesh.outputs.app_generation }} / ${{ steps.mesh.outputs.app_abi }}
          NIXPKGS: ${{ steps.mesh.outputs.nixpkgs_generation }} / ${{ steps.mesh.outputs.nixpkgs_abi }}
        run: |
          if [[ $MATCH == true ]]; then ref=$NIXPKGS_MESH_REF; else ref=$NIXPKGS_RELEASE_REF; fi
          ref="${INPUT_REF:-$ref}"
          echo "nixpkgs_ref=$ref" >> "$GITHUB_OUTPUT"
          {
            echo "MeshLLM stage generation / skippy ABI: buzz-app main $APP, nixpkgs $NIXPKGS (match: $MATCH)."
            echo "Building with kleinbem/nixpkgs@$ref."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux
            runner: ubuntu-latest
          - name: aarch64-linux
            runner: ubuntu-24.04-arm
          # The tests start servers on 127.0.0.1 (__darwinAllowLocalNetworking)
          # and need trustd (sandboxProfile): a relaxed sandbox, as on Hydra.
          - name: aarch64-darwin
            runner: macos-15
            extra-conf: sandbox = relaxed
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 340
    steps:
      # The Rust workspace and WebKitGTK need more than the runner's free disk.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.NIXPKGS_REPO }}
          ref: ${{ needs.plan.outputs.nixpkgs_ref }}
          path: nixpkgs
          persist-credentials: false

      - uses: kleinbem/actions/nix-setup@7ec628296d5194e6e10031706387b992a10a1638 # v1.0.1
        with:
          github-token: ${{ github.token }}
          extra-conf: ${{ matrix.extra-conf }}

      - name: Build and test
        env:
          NIXPKGS: nixpkgs
          BUZZ_APP_REV: ${{ needs.plan.outputs.rev }}
        run: canary/buzz-app/run.sh

  # One issue for all platforms: opened or commented on any failure, closed
  # only when every platform is green.
  report:
    needs: [plan, build]
    # A failed plan (upstream main unresolved) is reported too.
    if: always() && needs.plan.result != 'cancelled'
    runs-on: ubuntu-latest
    # Only the report touches issues; build runs upstream main.
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.plan.result != 'success' && 'plan failed' || needs.plan.outputs.match == 'error' && format('{0}, MeshLLM check failed', needs.build.result) || needs.build.result }}
          BUZZ_APP_REV: ${{ needs.plan.outputs.rev }}
          MATCH: ${{ needs.plan.outputs.match }}
          BUILT_WITH: ${{ needs.plan.outputs.nixpkgs_ref }}
          # Only a run on main (no buzz_app_rev) speaks for main.
          ON_MAIN: ${{ inputs.buzz_app_rev == '' }}
        run: |
          # Once: the day buzz-app main's MeshLLM matches nixpkgs', Shared compute
          # can run on nixpkgs' runtime and buzz-app can follow mesh-llm.
          if [[ $MATCH == true && $ON_MAIN == true ]] && [[ -z "$(gh issue list --state all --search "in:title \"$MATCH_ISSUE_TITLE\"" --limit 100 --json title \
            --jq "map(select(.title == \"$MATCH_ISSUE_TITLE\"))[0].title // empty")" ]]; then
            gh issue create --title "$MATCH_ISSUE_TITLE" --body "buzz-app [\`${BUZZ_APP_REV:0:9}\`](https://github.com/block/buzz-app/commit/$BUZZ_APP_REV) pins a MeshLLM with the stage generation and skippy ABI of kleinbem/nixpkgs@$NIXPKGS_MESH_REF; built with @$BUILT_WITH ($RESULT): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          issue="$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --limit 100 --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\"))[0].number // empty")"
          if [[ $RESULT == success ]]; then
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" --comment "Green again at buzz-app \`${BUZZ_APP_REV:0:9}\`."
            fi
          else
            if [[ -n $BUZZ_APP_REV ]]; then
              body="buzz-app [\`${BUZZ_APP_REV:0:9}\`](https://github.com/block/buzz-app/commit/$BUZZ_APP_REV) fails ($RESULT): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            else
              body="buzz-app: could not resolve the upstream revision ($RESULT): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            fi
            if [[ -n "$issue" ]]; then
              gh issue comment "$issue" --body "$body"
            else
              gh issue create --title "$ISSUE_TITLE" --body "$body"
            fi
          fi
