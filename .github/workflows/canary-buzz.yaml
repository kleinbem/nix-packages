name: "Canary: Buzz"

# Builds nixpkgs' Buzz packages against Buzz main every night, so packaging
# breakage shows up long before the next desktop release reaches nixpkgs.
# A failure opens (or comments on) one issue; the next green run closes it.

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      buzz_rev:
        description: Buzz commit to build (default main)
        type: string
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: canary-buzz
  cancel-in-progress: false

env:
  # The prep branch for the next Buzz desktop release (already adapted to Buzz
  # main) until the packages land in NixOS/nixpkgs (buzz-relay: #574877);
  # then NixOS/nixpkgs master.
  NIXPKGS_REPO: kleinbem/nixpkgs
  NIXPKGS_REF: buzz-next
  ISSUE_TITLE: "Canary: Buzz packaging fails against Buzz main"

jobs:
  # One Buzz commit for every platform.
  plan:
    runs-on: ubuntu-latest
    outputs:
      rev: ${{ steps.rev.outputs.rev }}
    steps:
      - id: rev
        env:
          BUZZ_REV: ${{ inputs.buzz_rev }}
        run: |
          echo "rev=${BUZZ_REV:-$(git ls-remote https://github.com/block/buzz refs/heads/main | cut -f1)}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          # The NixOS test needs KVM, which only the x86 runners have.
          - name: x86_64-linux
            runner: ubuntu-latest
            attrs: buzz-cli buzz-agent buzz-dev-mcp git-credential-nostr git-sign-nostr buzz-acp buzz-backend-kubernetes buzz-relay tests nixos
          - name: aarch64-linux
            runner: ubuntu-24.04-arm
            attrs: buzz-cli buzz-agent buzz-dev-mcp git-credential-nostr git-sign-nostr buzz-acp buzz-backend-kubernetes buzz-relay tests
          - name: aarch64-darwin
            runner: macos-15
            attrs: buzz-cli buzz-agent buzz-dev-mcp git-credential-nostr git-sign-nostr buzz-acp buzz-backend-kubernetes buzz-relay tests
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 340
    steps:
      # The Rust workspace and WebKitGTK need more than the runner's free disk.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.NIXPKGS_REPO }}
          ref: ${{ env.NIXPKGS_REF }}
          path: nixpkgs
          persist-credentials: false

      - uses: kleinbem/actions/nix-setup@d640cb482c1083235491da5ce469468a0019fc64 # v1.0.0
        with:
          github-token: ${{ github.token }}

      - name: Build
        env:
          NIXPKGS: nixpkgs
          BUZZ_REV: ${{ needs.plan.outputs.rev }}
          ATTRS: ${{ matrix.attrs }}
        run: |
          # shellcheck disable=SC2086 # ATTRS is a space-separated list
          canary/buzz/run.sh $ATTRS

  # One issue for all platforms: opened or commented on any failure, closed
  # only when every platform is green.
  report:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.build.result }}
          BUZZ_REV: ${{ needs.plan.outputs.rev }}
        run: |
          issue="$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number // empty')"
          if [[ $RESULT == success ]]; then
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" --comment "Green again at Buzz \`${BUZZ_REV:0:9}\`."
            fi
          else
            body="Buzz [\`${BUZZ_REV:0:9}\`](https://github.com/block/buzz/commit/$BUZZ_REV) fails ($RESULT): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            if [[ -n "$issue" ]]; then
              gh issue comment "$issue" --body "$body"
            else
              gh issue create --title "$ISSUE_TITLE" --body "$body"
            fi
          fi
