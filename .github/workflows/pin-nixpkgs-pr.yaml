name: Pin nixpkgs PR
# Pins an entry of nixpkgs-prs.json (packages from one of our open nixpkgs
# PRs) to a commit, through a PR that auto-merges once Check Flake is green.
# Pin only a commit whose packages are green on nixpkgs-review-gha. The fleet
# build of the pinned packages is gated in nix-config (build-all).
on:
  workflow_dispatch:
    inputs:
      name:
        description: Entry in nixpkgs-prs.json (e.g. buzz-app)
        required: true
        type: string
      rev:
        description: Full commit SHA to pin
        required: true
        type: string

# Every step that needs GitHub gets the App token explicitly.
permissions: {}

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: kleinbem/actions/nix-setup@7ec628296d5194e6e10031706387b992a10a1638 # v1.0.1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          nix-path: nixpkgs=channel:nixos-unstable

      - uses: kleinbem-dev/nix-detour/pr-pin@dad9ec7126d40ab791ef9dc8c5f54d5380406e9d # v0.3.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          name: ${{ inputs.name }}
          rev: ${{ inputs.rev }}
