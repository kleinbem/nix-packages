name: nixpkgs PRs merged
# Weekly: an entry of nixpkgs-prs.json whose packages nixpkgs now has in the
# same or a newer version goes, so nixpkgs' packages take over. Entries with
# NixOS modules get a draft instead: nix-config imports the module from here
# and has to switch to nixpkgs' own first.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

# Every step that needs GitHub gets the App token explicitly.
permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: kleinbem/actions/nix-setup@7ec628296d5194e6e10031706387b992a10a1638 # v1.0.1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          nix-path: nixpkgs=channel:nixos-unstable

      - uses: kleinbem-dev/nix-detour/pr-merged@dad9ec7126d40ab791ef9dc8c5f54d5380406e9d # v0.3.0
        with:
          token: ${{ steps.app-token.outputs.token }}
