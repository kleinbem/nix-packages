name: nixpkgs PRs merged
# Weekly: an entry of nixpkgs-prs.json whose packages nixpkgs now has in the
# same or a newer version goes, so nixpkgs' packages take over. Entries with
# NixOS modules get a draft instead: nix-config imports the module from here
# and has to switch to nixpkgs' own first.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: kleinbem/actions/nix-setup@d640cb482c1083235491da5ce469468a0019fc64 # v1.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          nix-path: nixpkgs=channel:nixos-unstable

      - uses: kleinbem-dev/nix-detour/pr-merged@5abc0ab5998f61f51bff1a48ad5db5ecbea803f0 # main
        with:
          token: ${{ steps.app-token.outputs.token }}
