name: "Update Langfuse"

# Bumps pkgs/langfuse/default.nix to the latest Langfuse release and opens
# a PR. Runs on ubuntu-latest — the underlying pnpm deps fetch is one-shot
# per version bump, and the resulting build is cached to Attic for downstream
# warm-up workflows.
#
# Update cadence: Langfuse releases ~2x per week. Weekly CI keeps lag ≤ 1 week.
# For urgent security releases, trigger manually via workflow_dispatch.

on:
  schedule:
    # Sundays 04:00 UTC — offset from Antigravity (Saturday 05:00).
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: "Bump default.nix & open PR"
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Set up Nix
        uses: cachix/install-nix-action@v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            access-tokens = github.com=${{ steps.app-token.outputs.token }}

      - name: Run updater
        id: update
        run: |
          chmod +x scripts/update-langfuse.sh
          ./scripts/update-langfuse.sh
          if git diff --quiet pkgs/langfuse/default.nix; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            VER=$(grep -oP 'version = "\K[^"]+' pkgs/langfuse/default.nix | head -1)
            echo "version=$VER" >> "$GITHUB_OUTPUT"
          fi

      # Was peter-evans/create-pull-request, which does a plain local
      # `git commit` — unsigned, and can never satisfy this org's
      # required_signatures branch ruleset, so auto-merge below would never
      # fire. createCommitOnBranch commits server-side and GitHub signs it
      # automatically ("Verified", committer=GitHub), no key material needed.
      - name: Open PR
        id: cpr
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH_NAME="auto-update/langfuse"
          REPO="${{ github.repository }}"
          MAIN_SHA=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)

          if gh api "repos/$REPO/git/ref/heads/$BRANCH_NAME" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/heads/$BRANCH_NAME" -f sha="$MAIN_SHA" -F force=true >/dev/null
          else
            gh api "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH_NAME" -f sha="$MAIN_SHA" >/dev/null
          fi

          jq -n \
            --arg repo "$REPO" \
            --arg branch "$BRANCH_NAME" \
            --arg sha "$MAIN_SHA" \
            --arg headline "chore: update langfuse to ${{ steps.update.outputs.version }}" \
            --arg content "$(base64 -w0 pkgs/langfuse/default.nix)" \
            --arg query 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }' \
            '{query: $query, variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                message: {headline: $headline},
                expectedHeadOid: $sha,
                fileChanges: {additions: [{path: "pkgs/langfuse/default.nix", contents: $content}]}
            }}}' | gh api graphql --input -

          BODY_FILE=$(mktemp)
          cat > "$BODY_FILE" <<'EOF'
          ## Langfuse update

          Bumps `pkgs/langfuse/default.nix` to **${{ steps.update.outputs.version }}**.
          Source hash and pnpm deps hash updated; pnpm major version checked.

          ✅ Full `nix build .#langfuse` passed on the hosted runner.

          After merge, bump the `nix-packages` submodule in `kleinbem/nix` to
          warm Attic via `build-packages`.

          ---
          🤖 Opened automatically by the update-langfuse workflow.
          EOF

          gh pr create \
            --title "chore: update langfuse to ${{ steps.update.outputs.version }}" \
            --body-file "$BODY_FILE" \
            --head "$BRANCH_NAME" \
            --base main \
            --label automated \
            --label dependencies || true

          echo "pull-request-number=$(gh pr view "$BRANCH_NAME" --json number --jq .number)" >> "$GITHUB_OUTPUT"

      - name: Auto-merge
        if: steps.update.outputs.changed == 'true' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR" --squash --delete-branch --auto \
            || gh pr merge "$PR" --squash --delete-branch
