name: "Update packages"

# One PR per package for everything whose passthru.updateScript is
# nix-update-script (scripts/update-packages.sh list). Packages with their
# own updater (langfuse, buzz, oh-my-pi, antigravity) don't use it.

on:
  schedule:
    # Mondays 05:00 UTC; the per-package updaters take the other days.
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      package:
        description: "Only this attribute (empty: all)"
        required: false
        default: ""

permissions: {}

jobs:
  list:
    name: "List packages"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kleinbem/actions/nix-setup@7ec628296d5194e6e10031706387b992a10a1638 # v1.0.1
      - name: List
        id: list
        env:
          ONLY: ${{ inputs.package }}
        run: |
          matrix=$(./scripts/update-packages.sh list |
            jq -c --arg only "$ONLY" '[.[] | select($only == "" or .attr == $only) | .attr]')
          echo "$matrix"
          [[ $matrix != "[]" ]] || { echo "no package matches" >&2; exit 1; }
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  update:
    name: "Update ${{ matrix.attr }}"
    needs: list
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A scheduled run and a dispatch must not reset the same PR branch at once.
    concurrency:
      group: update-packages-${{ matrix.attr }}
    strategy:
      fail-fast: false
      matrix:
        attr: ${{ fromJSON(needs.list.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The build runs upstream code: only the read-only job token until here.
      - uses: kleinbem/actions/nix-setup@7ec628296d5194e6e10031706387b992a10a1638 # v1.0.1
        with:
          github-token: ${{ github.token }}

      # nix-update builds the new version and runs passthru.tests; that is
      # the gate before the PR auto-merges.
      - name: Update, build and test
        id: update
        env:
          ATTR: ${{ matrix.attr }}
        run: |
          msg=$(mktemp)
          ./scripts/update-packages.sh update "$ATTR" --write-commit-message "$msg"
          if [[ -z $(git status --porcelain) ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "changed=true"
            echo "title=$(head -1 "$msg")"
            echo 'body<<EOF_BODY'
            tail -n +2 "$msg"
            echo EOF_BODY
          } >> "$GITHUB_OUTPUT"

      - name: Mint GitHub App installation token
        id: app-token
        if: steps.update.outputs.changed == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Commits through createCommitOnBranch so GitHub signs the commit;
      # main requires signed commits.
      - name: Open PR
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ATTR: ${{ matrix.attr }}
          TITLE: ${{ steps.update.outputs.title }}
          BODY: ${{ steps.update.outputs.body }}
          REPO: ${{ github.repository }}
        run: |
          branch="auto-update/$ATTR"
          main_sha=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          if gh api "repos/$REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/heads/$branch" -f sha="$main_sha" -F force=true >/dev/null
          else
            gh api "repos/$REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$main_sha" >/dev/null
          fi

          # Files go through temp files: argv can't hold a large base64 blob.
          additions=$(mktemp)
          git ls-files -m -o --exclude-standard | while read -r f; do
            base64 -w0 "$f" | jq -Rs --arg p "$f" '{path: $p, contents: .}'
          done | jq -s . > "$additions"
          jq -n \
            --arg repo "$REPO" --arg branch "$branch" --arg sha "$main_sha" \
            --arg headline "$TITLE" --slurpfile additions "$additions" \
            --arg query 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }' \
            '{query: $query, variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                message: {headline: $headline},
                expectedHeadOid: $sha,
                fileChanges: {additions: $additions[0]}
            }}}' | gh api graphql --input -

          body=$(printf '%s\n\n%s\n\n---\n%s\n' "$BODY" \
            "nix-update --build --test passed on the runner." \
            "🤖 Opened by the update-packages workflow.")
          open=$(gh pr list -R "$REPO" --head "$branch" --state open --json number --jq length)
          [[ $open != 0 ]] ||
            gh pr create -R "$REPO" --title "$TITLE" --body "$body" \
              --head "$branch" --base main --label automated
          gh pr merge "$branch" -R "$REPO" --squash --delete-branch --auto ||
            gh pr merge "$branch" -R "$REPO" --squash --delete-branch
