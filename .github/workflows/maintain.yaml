name: Maintain Flake
on:
  workflow_dispatch:
  schedule:
    # 02:15 UTC — layer 2 (depends on nix-devshells which runs at 02:00).
    - cron: '15 2 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: cachix/install-nix-action@v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            access-tokens = github.com=${{ steps.app-token.outputs.token }}

      - name: Update flake inputs
        run: nix flake update

      - name: Validate flake (eval-only — blocks a bad lock from landing)
        run: nix flake check --no-build

      - name: Open PR for flake.lock updates (auto-merges once Check Flake is green)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git diff --quiet flake.lock; then
            echo "flake.lock unchanged — nothing to do."
            exit 0
          fi

          BRANCH_NAME="update-flake-lock"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git add flake.lock
          git commit -m "chore: update flake.lock (auto)"
          git push -f origin "$BRANCH_NAME"

          gh pr create \
            --title "chore: update flake.lock" \
            --body "Automated lockfile update. Check Flake re-validates the new inputs on this PR; auto-merge is enabled and lands this once it's green." \
            --head "$BRANCH_NAME" \
            --base main || true

          gh pr merge "$BRANCH_NAME" --auto --squash || true
