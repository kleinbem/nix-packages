name: "Langfuse VM test"

# Builds langfuse and boots web + worker in a NixOS VM (pkgs/langfuse/test.nix).
# Too heavy for ci.yaml's flake check, so it runs only when Langfuse changes.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pkgs/langfuse/**'
      - 'modules/nixos/langfuse.nix'
      - '.github/workflows/langfuse.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vm-test:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kleinbem/actions/nix-setup@7ec628296d5194e6e10031706387b992a10a1638 # v1.0.1
        with:
          nix-path: nixpkgs=channel:nixos-unstable
          # No free-disk-space: it removes the swap, and the web build then
          # gets OOM-killed (exit 143). The updater builds fine without it.
          netbird-setup-key: ${{ secrets.NETBIRD_SETUP_KEY_EPHEMERAL }}
          attic-token: ${{ secrets.ATTIC_PULL_TOKEN }}
      - name: Build and run the VM test
        run: nix build --no-link --print-build-logs .#legacyPackages.x86_64-linux.langfuse.tests.vm
