name: "Canary: skippy"

# Builds nixpkgs' skippy packages against Mesh-LLM/skippy main every night, so
# packaging breakage shows up before a release reaches nixpkgs.

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:
    inputs:
      skippy_rev:
        description: Skippy commit to build (default main)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: canary-skippy
  cancel-in-progress: false

env:
  NIXPKGS_REPO: kleinbem/nixpkgs
  NIXPKGS_REF: mesh-llm-dev
  ISSUE_TITLE: "Canary: skippy packaging fails against Mesh-LLM/skippy main"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      rev: ${{ steps.rev.outputs.rev }}
    steps:
      - id: rev
        env:
          SKIPPY_REV: ${{ inputs.skippy_rev }}
        run: |
          rev="${SKIPPY_REV:-$(git ls-remote https://github.com/Mesh-LLM/skippy refs/heads/main | cut -f1)}"
          [[ -n $rev ]] || { echo "could not resolve Mesh-LLM/skippy main" >&2; exit 1; }
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux
            runner: ubuntu-latest
            attrs: native-runtime skippy skippy-tools serve
          - name: x86_64-linux GPU runtimes
            runner: ubuntu-latest
            attrs: runtime-rocm runtime-cuda
            config: '{ allowUnfree = true; }'
          - name: aarch64-linux
            runner: ubuntu-24.04-arm
            attrs: native-runtime skippy skippy-tools serve
          - name: aarch64-darwin
            runner: macos-15
            attrs: native-runtime skippy skippy-tools
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 340
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.NIXPKGS_REPO }}
          ref: ${{ env.NIXPKGS_REF }}
          path: nixpkgs
          persist-credentials: false

      - uses: kleinbem/actions/nix-setup@d5aec5d8fbed30867e0b2c1d781992844240ee1e # v1.10.0
        with:
          github-token: ${{ github.token }}

      - name: Build
        env:
          NIXPKGS: nixpkgs
          SKIPPY_REV: ${{ needs.plan.outputs.rev }}
          CANARY_NIXPKGS_CONFIG: ${{ matrix.config }}
          ATTRS: ${{ matrix.attrs }}
        run: |
          # shellcheck disable=SC2086 # ATTRS is a space-separated list
          canary/skippy/run.sh $ATTRS

  report:
    needs: [plan, build]
    if: always() && needs.plan.result != 'cancelled' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.plan.result == 'success' && needs.build.result || 'plan failed' }}
          SKIPPY_REV: ${{ needs.plan.outputs.rev }}
          CUSTOM_REV: ${{ github.event.inputs.skippy_rev }}
        run: |
          [[ -n $CUSTOM_REV ]] && exit 0
          issue="$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --limit 100 --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\"))[0].number // empty")"
          if [[ $RESULT == success ]]; then
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" --comment "Green again at Skippy \`${SKIPPY_REV:0:9}\`."
            fi
          else
            if [[ -n $SKIPPY_REV ]]; then
              body="Skippy [\`${SKIPPY_REV:0:9}\`](https://github.com/Mesh-LLM/skippy/commit/$SKIPPY_REV) fails ($RESULT): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            else
              body="Skippy: could not resolve the upstream revision ($RESULT): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            fi
            if [[ -n "$issue" ]]; then
              gh issue comment "$issue" --body "$body"
            else
              gh issue create --title "$ISSUE_TITLE" --body "$body"
            fi
          fi
